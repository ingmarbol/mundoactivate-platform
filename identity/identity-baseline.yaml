version: 1
project: mundoactivate-platform
principles:
  - verify_explicitly
  - use_least_privilege
  - assume_breach
workforce:
  federation_required: true
  mfa_required: true
  shared_accounts_forbidden: true
  break_glass:
    count: 2
    monitored: true
    tested_quarterly: true
workloads:
  long_lived_cloud_credentials_forbidden: true
  preferred_authentication:
    aws: iam_role_with_oidc_or_pod_identity
    azure: managed_identity_or_workload_identity
ci_cd:
  oidc_required: true
  protected_environments_for_production: true
  subject_claim_restricted: true
reviews:
  access_review_frequency_days: 90
  privileged_access_review_frequency_days: 30

