apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: telemetry-exporter
  namespace: observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: multicloud-secret-store
    kind: ClusterSecretStore
  target:
    name: telemetry-exporter-runtime
    creationPolicy: Owner
  data:
    - secretKey: exporter-token
      remoteRef:
        key: nonprod/observability/exporter
        property: token
# This manifest contains references only. The value remains in the provider.

