version: 1
environment: nonprod

providers:
  aws:
    service: AWS Secrets Manager
    encryption: AWS KMS
    authentication: EKS Pod Identity
    rotation_days: 30
    audit: CloudTrail
  azure:
    service: Azure Key Vault
    encryption: platform-managed-HSM
    authentication: AKS Workload Identity
    rotation_days: 30
    soft_delete: true
    purge_protection: true
    audit: Azure Monitor

secrets:
  - name: learning-api-database
    classification: confidential
    owner: platform-team
    consumers:
      - namespace: learning
        service_account: learning-api
    delivery: csi-volume
    rotation_days: 30
    sync_to_kubernetes_secret: false
  - name: telemetry-exporter-token
    classification: restricted
    owner: observability-team
    consumers:
      - namespace: observability
        service_account: otel-collector
    delivery: external-secrets
    rotation_days: 30
    sync_to_kubernetes_secret: true

pki:
  issuer: private-ca
  workload_certificate_validity_hours: 24
  renew_before_hours: 8
  private_keys_exportable: false
  revocation: crl
  expiry_alert_days: 7

incident_response:
  - identify_scope
  - revoke_or_disable
  - rotate_credential
  - redeploy_consumers
  - review_audit_logs
  - verify_no_reuse

