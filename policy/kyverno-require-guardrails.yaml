apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-workload-guardrails
  annotations:
    policies.kyverno.io/title: Require workload guardrails
    policies.kyverno.io/category: Pod Security
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: require-non-root
      match:
        any:
          - resources:
              kinds: [Pod]
      validate:
        failureAction: Audit
        message: Containers must run as non-root.
        pattern:
          spec:
            containers:
              - securityContext:
                  runAsNonRoot: true
    - name: require-resources
      match:
        any:
          - resources:
              kinds: [Pod]
      validate:
        failureAction: Audit
        message: Containers must define requests and limits.
        pattern:
          spec:
            containers:
              - resources:
                  requests:
                    cpu: "?*"
                    memory: "?*"
                  limits:
                    cpu: "?*"
                    memory: "?*"
