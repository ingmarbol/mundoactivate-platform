apiVersion: apps/v1
kind: Deployment
metadata:
  name: learning-api
  namespace: tenant-blue
  labels: {app.kubernetes.io/name: learning-api, platform.example.com/tenant: blue}
spec:
  replicas: 2
  selector:
    matchLabels: {app.kubernetes.io/name: learning-api}
  template:
    metadata:
      labels: {app.kubernetes.io/name: learning-api, platform.example.com/tenant: blue}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: api
          image: nginxinc/nginx-unprivileged:1.27-alpine
          ports: [{containerPort: 8080}]
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts: [{name: cache, mountPath: /tmp}]
      volumes:
        - name: cache
          emptyDir: {sizeLimit: 64Mi}
