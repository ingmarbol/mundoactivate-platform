apiVersion: v1
kind: Namespace
metadata:
  name: learning
  labels:
    istio.io/dataplane-mode: ambient
    platform.example.com/owner: learning-team
---
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: strict-mtls
  namespace: learning
spec:
  mtls:
    mode: STRICT
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: default-deny
  namespace: learning
spec: {}
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-frontend-to-api
  namespace: learning
spec:
  selector:
    matchLabels:
      app: learning-api
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/learning/sa/frontend
      to:
        - operation:
            methods: [GET]
            paths: [/courses, /courses/*]
---
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: learning-api
  namespace: learning
spec:
  host: learning-api.learning.svc.cluster.local
  trafficPolicy:
    connectionPool:
      http:
        http1MaxPendingRequests: 100
        maxRequestsPerConnection: 100
    outlierDetection:
      consecutive5xxErrors: 5
      interval: 10s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
  subsets:
    - name: stable
      labels: {version: stable}
    - name: canary
      labels: {version: canary}
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: learning-api
  namespace: learning
spec:
  hosts: [learning-api.learning.svc.cluster.local]
  http:
    - timeout: 2s
      retries:
        attempts: 2
        perTryTimeout: 700ms
        retryOn: connect-failure,reset,503
      route:
        - destination: {host: learning-api.learning.svc.cluster.local, subset: stable}
          weight: 90
        - destination: {host: learning-api.learning.svc.cluster.local, subset: canary}
          weight: 10
